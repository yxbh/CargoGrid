name: Adjustable-stop STEP qualification

on:
  push:
    paths:
      - .github/workflows/stop-step.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Fetch the trusted main lock and Python
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_tests.py fetch --repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" --base "$GITHUB_SHA" --pr 0 --output .local/stop-qualification/baseline
      - name: Require the resolved main lock
        env:
          PINNED: ${{ steps.baseline.outputs.pinned }}
        run: |
          test "$PINNED" = true
          cp .local/stop-qualification/baseline/uv.lock uv.lock
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ steps.baseline.outputs.python }}
          enable-cache: true
          prune-cache: false
          cache-suffix: full-wheels-v1
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: ./.github/actions/cad-runtime
        if: runner.os == 'Linux'
      - run: uv sync --frozen --group dev
      - name: Record resources and dependencies
        run: |
          mkdir -p .local/stop-qualification/reports
          uv run --no-sync python tools/ci_tests.py resources > .local/stop-qualification/reports/resources.txt
      - name: Record all STEP modes and require the unchanged fallback
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from build123d import PrecisionMode, export_step, import_step
          from cargo_grid.adjustable_stop import _make_base
          from cargo_grid.export import _StepSource, _adaptive_volume, _checked_step_roundtrip

          root = Path(".local/stop-qualification")
          steps = root / "steps"
          steps.mkdir()
          base = _make_base()
          source = _StepSource.measure(base)
          report = {
              "commit": os.environ["GITHUB_SHA"],
              "lock_sha256": hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest(),
              "source_volume_mm3": source.adaptive_volume,
              "volume_budget_mm3": source.volume_budget,
              "source_bounds_mm": [list(source.bounds.minimum), list(source.bounds.maximum)],
              "modes": {},
          }
          for mode in PrecisionMode:
              path = steps / f"{mode.name.lower()}.step"
              assert export_step(base, path, precision_mode=mode)
              restored = import_step(path)
              delta = _adaptive_volume(restored) - source.adaptive_volume
              bounds = restored.bounding_box()
              bounds_delta = max(
                  abs(old - new)
                  for old, new in zip(
                      (*source.bounds.minimum, *source.bounds.maximum),
                      (*bounds.min, *bounds.max),
                  )
              )
              report["modes"][mode.name.lower()] = {
                  "volume_delta_mm3": delta,
                  "bounds_delta_mm": bounds_delta,
                  "valid": restored.is_valid,
                  "solids": len(restored.solids()),
                  "accepted": (
                      restored.is_valid
                      and len(restored.solids()) == 1
                      and abs(delta) <= source.volume_budget
                      and bounds_delta <= 1e-5
                  ),
              }
              (root / "reports/step.json").write_text(json.dumps(report, indent=2) + "\n")
          _, mode, delta, budget, bounds_delta = _checked_step_roundtrip(
              base, steps / "fallback.step", _source=source
          )
          report["fallback"] = {
              "mode": mode,
              "volume_delta_mm3": delta,
              "volume_budget_mm3": budget,
              "bounds_delta_mm": bounds_delta,
          }
          (root / "reports/step.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Run the adjustable-stop geometry and mechanism checks
        run: uv run --no-sync pytest -q tests/test_adjustable_stop.py -m "not native" --junitxml=.local/stop-qualification/reports/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: stop-step-${{ matrix.os }}
          path: .local/stop-qualification/reports
          include-hidden-files: true
          retention-days: 30
