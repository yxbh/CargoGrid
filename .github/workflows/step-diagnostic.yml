name: Temporary STEP investigation

on:
  push:
    branches: [yxbh-cargogrid-staged-rewrite]
    paths:
      - .github/workflows/step-diagnostic.yml
      - tools/diagnose_step.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: test-map-main
          run-id: 39752654446
          github-token: ${{ github.token }}
          path: .local/step-probe/lock
      - run: cp .local/step-probe/lock/uv.lock uv.lock
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: 3.12.3
      - name: Install Linux CAD libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglu1-mesa
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python tools/ci_tests.py resources
      - name: Compare unchanged source and STEP reimports
        run: uv run --no-sync python tools/diagnose_step.py --output .local/step-probe/data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: step-probe-${{ matrix.os }}
          path: .local/step-probe
          include-hidden-files: true
          retention-days: 30
