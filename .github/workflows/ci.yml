name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Full suite and fresh-dependency publish fingerprints, Saturday 17:23 UTC.
    - cron: "23 17 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: Full suite, or full suite plus publish fingerprints
        type: choice
        options:
          - full
          - weekly
        default: full
      approve_fingerprints:
        description: Reviewed exact fingerprint digest, only when accepting a reported change
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      python: ${{ steps.plan.outputs.python }}
      wheel: ${{ steps.plan.outputs.wheel }}
      weekly: ${{ steps.plan.outputs.weekly }}
      contracts_only: ${{ steps.plan.outputs.contracts_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/test-map
          key: test-map-main-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-map-main-
      - name: Keep the main baseline before restoring this PR's map
        run: |
          if [ -d .local/test-map ]; then
            cp -R .local/test-map .local/main-map
          fi
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          path: .local/test-map
          key: test-map-pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-map-pr-${{ github.event.pull_request.number }}-
      - name: Choose the cached main lock and compatible same-repository PR map
        id: baseline
        env:
          SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 tools/test_selection.py ci-baseline --main .local/main-map --pr .local/test-map --same-repo "$SAME_REPO" --output .local/baseline
      - name: Seed the dependency cache key from the trusted lock
        run: |
          if [ -f .local/baseline/uv.lock ]; then
            cp .local/baseline/uv.lock uv.lock
          fi
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ github.event_name == 'pull_request' && steps.baseline.outputs.pinned == 'true' && steps.baseline.outputs.python || '3.12' }}
          enable-cache: true
          prune-cache: false
          cache-suffix: full-wheels-v1
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Resolve fresh on main and backstops; pin PRs to main's lock
        env:
          PINNED: ${{ steps.baseline.outputs.pinned }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$PINNED" = true ]; then
            cp .local/baseline/uv.lock uv.lock
          else
            uv lock --upgrade
          fi
          uv sync --frozen --group dev
      - name: Collect everything before selecting
        id: plan
        env:
          MODE: ${{ github.event_name == 'schedule' && 'weekly' || inputs.mode || (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')) && 'full' || 'selected' }}
        run: uv run --no-sync python tools/test_selection.py ci-plan --baseline .local/baseline --output .local/ci-plan --mode "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-plan
          path: .local/ci-plan
          include-hidden-files: true
          retention-days: 14

  checks:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-tests
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - name: Install CAD runtime libraries
        if: needs.plan.outputs.wheel == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglu1-mesa
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          git diff --check
      - name: Build and inspect distributions
        if: needs.plan.outputs.wheel == 'true'
        run: |
          uv build --out-dir .local/dist
          uv run --no-sync python tools/check_distributions.py .local/dist
      - name: Installed wheel smoke test
        if: needs.plan.outputs.wheel == 'true'
        run: |
          uv venv --python "${{ needs.plan.outputs.python }}" .local/wheel-smoke
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file .local/runtime-requirements.txt
          uv pip install --python .local/wheel-smoke/bin/python -r .local/runtime-requirements.txt .local/dist/*.whl
          cd .local
          env -u PYTHONPATH wheel-smoke/bin/python -m cargo_grid --version
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid --help
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --build-width-mm 150 --build-depth-mm 150 --build-height-mm 50 --no-stl --output wheel-job
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; d=json.load(open("wheel-job/manifest.json"))["designs"][0]; assert (d["parameters"]["hole_diameter"],d["parameters"]["hole_scope"]) == (10.0,"full"), "wheel default hole pattern changed"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --unit-size-mm 30 --tile-thickness-mm 8 --build-width-mm 100 --build-depth-mm 100 --build-height-mm 50 --no-holes --no-stl --output wheel-scaled
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; d=json.load(open("wheel-scaled/manifest.json"))["designs"][0]; assert d["parameters"]["interface"]["pitch"] == 30 and d["parameters"]["interface"]["height"] == 8, "wheel scaled interface changed"; assert all(abs(a-b) < 1e-5 for a,b in zip(d["size_mm"],[33.0,33.0,8.0])), "wheel scaled bounds changed"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family vertical-tile-bracket --width-cells 1 --depth-cells 2 --build-width-mm 350 --build-depth-mm 320 --build-height-mm 325 --bambu --material PETG PETG "#637b70" --nozzle-diameter-mm 0.4 --layer-height-mm 0.2 --no-stl --output wheel-bracket
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; p=json.load(open("wheel-bracket/manifest.json")); d=p["designs"][0]; assert (d["parameters"]["nx"],d["parameters"]["ny"]) == (1,2), "wheel bracket dimensions changed"; assert d["recommended_print_orientation"]["applied_to_exports"]["bambu_3mf"], "wheel bracket Bambu pose was not applied"; assert abs(p["export"]["plates"][0]["items"][0]["source_to_project_transform"]["rotation_x_degrees"] - 134.22827708427317) < 1e-12, "wheel bracket X rotation changed"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family vertical-stop --width-cells 2 --depth-cells 1 --stop-height-mm 120 --build-width-mm 350 --build-depth-mm 320 --build-height-mm 325 --bambu --material PETG PETG "#637b70" --nozzle-diameter-mm 0.4 --layer-height-mm 0.2 --no-stl --output wheel-stop
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; p=json.load(open("wheel-stop/manifest.json")); d=p["designs"][0]; i=p["export"]["plates"][0]["items"][0]; assert (d["parameters"]["nx"],d["parameters"]["ny"],d["parameters"]["height"]) == (2,1,120), "wheel stop dimensions changed"; assert i["object_settings"] == {"enable_support":"1","support_type":"normal(auto)"}, "wheel stop Auto support metadata changed"; assert abs(i["source_to_project_transform"]["rotation_x_degrees"] - 116.08947705488677) < 1e-12, "wheel stop X rotation changed"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family ramp --width-cells 3 --build-width-mm 350 --build-depth-mm 320 --build-height-mm 325 --bambu --material PETG PETG "#637b70" --nozzle-diameter-mm 0.4 --layer-height-mm 0.2 --no-stl --output wheel-ramp
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; p=json.load(open("wheel-ramp/manifest.json")); d=p["designs"][0]; i=p["export"]["plates"][0]["items"][0]; assert (d["parameters"]["nx"],d["parameters"]["ny"]) == (3,1), "wheel ramp cells changed"; assert all(abs(a-b) < 1e-5 for a,b in zip(d["size_mm"],[180.0,50.0,13.0])), "wheel ramp bounds changed: %r" % d["size_mm"]; assert i["object_settings"] == {"enable_support":"1","support_type":"normal(auto)"}, "wheel ramp Auto support metadata changed"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family ramp --ramp-join male --width-cells 3 --build-width-mm 350 --build-depth-mm 320 --build-height-mm 325 --bambu --material PETG PETG "#637b70" --nozzle-diameter-mm 0.4 --layer-height-mm 0.2 --no-stl --output wheel-ramp-male
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; p=json.load(open("wheel-ramp-male/manifest.json")); d=p["designs"][0]; i=p["export"]["plates"][0]["items"][0]; assert d["parameters"]["ramp_join"] == "male", "wheel male ramp choice changed"; assert all(abs(a-b) < 1e-5 for a,b in zip(d["size_mm"],[180.0,56.0,13.0])), "wheel male ramp tab bounds changed: %r" % d["size_mm"]; assert d["mating_datums"]["finished_run"] == 50 and d["mating_datums"]["tab_projection"] == 6, "wheel male ramp run and tab projection were conflated"; assert "object_settings" not in i, "wheel male ramp unexpectedly requests support"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family rod --rod-height-mm 240 --build-width-mm 260 --build-depth-mm 40 --build-height-mm 20 --bambu --material PETG PETG "#637b70" --nozzle-diameter-mm 0.8 --layer-height-mm 0.32 --no-stl --output wheel-rod
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; p=json.load(open("wheel-rod/manifest.json")); d=p["designs"][0]; i=p["export"]["plates"][0]["items"][0]; assert d["parameters"]["above_mat_height_mm"] == 240 and d["mating_datums"]["insertion_depth_mm"] == 12; assert i["source_to_project_transform"]["rotation_y_degrees"] == 90; assert i["object_settings"] == {"enable_support":"1","support_type":"normal(auto)"}; assert d["fit_evidence"]["status"] == "user-reported-fit"'
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family rod-brace --brace-spacing-mm 120 --build-width-mm 150 --build-depth-mm 30 --build-height-mm 10 --no-stl --output wheel-rod-brace
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; d=json.load(open("wheel-rod-brace/manifest.json"))["designs"][0]; assert d["parameters"]["bore_diameter_mm"] == 10; assert d["mating_datums"]["center_spacing_mm"] == 120; assert abs(d["mating_datums"]["straight_bore_length_mm"] - 5.6) < 1e-9; e=d["fit_evidence"]; assert e["status"] == "user-reported-fit" and e["scope"] == "bore-to-shaft fit only"; assert e["physical_test_pending"] is False and e["tested_center_spacings_mm"] is None and e["spacing_specific_fit_verified"] is False'
      - name: Run selected contracts without a test runner job
        if: needs.plan.outputs.contracts_only == 'true'
        run: uv run --no-sync pytest -q tests/contracts -n 4 --dist loadgroup -m "not native" --select-tests .local/ci-plan/plan.json --test-shard 0 --record-test-map .local/parts --durations=0 --durations-min=0 --junitxml=.local/selected-junit.xml
      - name: Check the unchanged portable per-case budget
        if: ${{ !cancelled() && needs.plan.outputs.contracts_only == 'true' && hashFiles('.local/selected-junit.xml') != '' }}
        run: uv run --no-sync python tools/check_test_durations.py .local/selected-junit.xml --selection-plan .local/ci-plan/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && needs.plan.outputs.contracts_only == 'true' }}
        with:
          name: test-parts-0
          path: |
            .local/parts
            .local/selected-junit.xml
          include-hidden-files: true
          retention-days: 14

  tests:
    needs: plan
    if: needs.plan.outputs.contracts_only != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-tests
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - name: Install CAD runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglu1-mesa
      - name: Run selected cases, including selected slow cases
        run: uv run --no-sync pytest -q tests -n 4 --dist loadgroup -m "not native" --select-tests .local/ci-plan/plan.json --test-shard "${{ matrix.shard }}" --record-test-map .local/parts --durations=0 --durations-min=0 --junitxml=.local/selected-junit.xml
      - name: Check the unchanged portable per-case budget
        if: ${{ !cancelled() && hashFiles('.local/selected-junit.xml') != '' }}
        run: uv run --no-sync python tools/check_test_durations.py .local/selected-junit.xml --selection-plan .local/ci-plan/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: test-parts-${{ matrix.shard }}
          path: |
            .local/parts
            .local/selected-junit.xml
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: plan
    if: needs.plan.outputs.weekly == 'true'
    strategy:
      fail-fast: false
      matrix:
        printer: ["h2d", "x2d"]
        set: ["Full-Catalogue", "Zeekr-7X-Expansion-Set", "Pull-Handle-Set", "Adjustable-Stop"]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-tests
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - name: Fresh source-derived fingerprints
        env:
          PRINTER: ${{ matrix.printer }}
          SET: ${{ matrix.set }}
        run: uv run --no-sync python tools/publish_guard.py fingerprints --printer "$PRINTER" --set "$SET" --output ".local/publish/$PRINTER-$SET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-${{ matrix.printer }}-${{ matrix.set }}
          path: .local/publish
          include-hidden-files: true
          retention-days: 90

  CI:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [plan, checks, tests, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every selected check and backstop
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          PUBLISH: ${{ needs.publish.result }}
          CONTRACTS_ONLY: ${{ needs.plan.outputs.contracts_only }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          test "$TESTS" = success || { test "$CONTRACTS_ONLY" = true && test "$TESTS" = skipped; }
          test "$PUBLISH" = success || test "$PUBLISH" = skipped
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: test-plan
          path: .local/ci-plan
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: test-parts-*
          path: .local/parts
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.plan.outputs.weekly == 'true'
        with:
          pattern: publish-*
          path: .local/publish
          merge-multiple: true
      - run: cp .local/ci-plan/uv.lock uv.lock
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ needs.plan.outputs.python }}
          enable-cache: false
      - name: Validate exact coverage and refresh the map only after success
        env:
          APPROVAL: ${{ inputs.approve_fingerprints }}
        run: uv run --no-project python tools/test_selection.py ci-complete --plan .local/ci-plan --parts .local/parts --publish .local/publish --approve "$APPROVAL" --output .local/test-map
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && hashFiles('.local/fingerprint-report.json') != '' }}
        with:
          name: fingerprint-report
          path: .local/fingerprint-report.json
          include-hidden-files: true
          retention-days: 90
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/test-map
          key: test-map-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
