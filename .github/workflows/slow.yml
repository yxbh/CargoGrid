name: Slow tests

# Exhaustive parameter sweeps and review-package exports that portable CI leaves out.
on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: slow-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.12"
      - name: Install CAD runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglu1-mesa
      - name: Install dependencies
        run: uv sync --group dev
      - name: Record runner resources
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata
          import os
          import platform
          from pathlib import Path

          print("Platform:", platform.platform())
          print("Logical CPUs:", os.cpu_count())
          print("\n".join(line for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith(("MemTotal:", "MemAvailable:"))))
          for package in ("build123d", "cadquery-ocp-novtk", "numpy", "scipy", "pytest", "pytest-xdist"):
              print(package, importlib.metadata.version(package))
          PY
      - name: Slow geometry and export tests
        run: uv run --no-sync python tools/ci_memory_sampler.py -- /usr/bin/time -v uv run --no-sync pytest -q -n 4 --dist worksteal -m "slow and not native and not reference" --durations=0 --durations-min=0
