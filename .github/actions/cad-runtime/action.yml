name: CAD runtime libraries
description: Install Ubuntu CAD libraries, reusing downloaded Debian archives from the same runner image
runs:
  using: composite
  steps:
    - name: Check installed libraries and runner image
      id: runtime
      shell: bash
      run: |
        if [ "$(dpkg-query -W -f='${db:Status-Status}\n' libgl1 libglu1-mesa 2>/dev/null)" = "$(printf 'installed\ninstalled')" ]; then
          echo "CAD runtime libraries are already installed."
          echo "needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: steps.runtime.outputs.needed == 'true'
      id: packages
      with:
        path: ${{ runner.temp }}/cargo-grid-apt/*.deb
        key: cad-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.image }}-${{ hashFiles('.github/actions/cad-runtime/action.yml') }}
    - name: Download missing libraries
      if: steps.runtime.outputs.needed == 'true' && steps.packages.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-grid-apt"
        sudo apt-get update -qq
        sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/cargo-grid-apt" --download-only install --no-install-recommends -y libgl1 libglu1-mesa
    - name: Install cached libraries
      if: steps.runtime.outputs.needed == 'true'
      shell: bash
      run: |
        packages=("$RUNNER_TEMP"/cargo-grid-apt/*.deb)
        if [ ! -f "${packages[0]}" ]; then
          echo "::error::CAD runtime package cache contains no Debian archives"
          exit 1
        fi
        sudo dpkg --install "${packages[@]}"
        if [ "$(dpkg-query -W -f='${db:Status-Status}\n' libgl1 libglu1-mesa)" != "$(printf 'installed\ninstalled')" ]; then
          echo "::error::CAD runtime package cache did not install both required libraries"
          exit 1
        fi
